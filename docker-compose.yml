services:
  app:
    build: .
    container_name: my_nest_app
    ports:
      - "4000:4000"
    env_file:
        - .env
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:4000/ || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
        - app-network

  db:
    image: postgres:16-alpine
    container_name: postgres_db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  adminer:
    image: adminer
    container_name: adminer
    ports:
      - "8080:8080"
    profiles:
      - debug
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  pg-data:
    name: postgres_persistence
